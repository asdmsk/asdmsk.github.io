<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансляция: На Стремянном</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logo.png" alt="Логотип" class="main-logo">
            </div>
            <h1>НА СТРЕМЯННОМ</h1>
        </header>

        <div class="live-info">
            <span style="opacity: 0.8; font-size: 0.8rem;">ВРЕМЯ НАЧАЛА:</span>
            <span id="live-time" class="time-display">...</span>
        </div>

        <div class="channel-row">
            <a href="https://rutube.ru/channel/24704952/" class="btn" target="_blank">
                <i class="fas fa-play-circle"></i><span>RUTUBE</span>
            </a>
            <a href="https://www.youtube.com/c/asdstremianka/live" class="btn" target="_blank">
                <i class="fab fa-youtube"></i><span>YOUTUBE</span>
            </a>
        </div>

        <span class="section-label">Плеер Rutube: <span id="rutube-status" class="status-badge">СИНХРОНИЗАЦИЯ...</span></span>
        <div class="video-container">
            <iframe id="rutubePlayer" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        </div>

        <span class="section-label">Плеер YouTube:</span>
        <div class="video-container">
            <iframe 
                id="youtubePlayer" 
                src="" 
                frameborder="0" 
                allow="autoplay; encrypted-media; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <nav>
            <a href="index.html" class="btn" style="justify-content: center;">
                <i class="fas fa-arrow-left"></i><span>НА ГЛАВНУЮ</span>
            </a>
        </nav>

        <footer>
            <p>© 2026 Община на Стремянном</p>
        </footer>
    </div>

    <script>
        // 1. Определение времени и дня недели
        const now = new Date();
        const isSaturday = (now.getDay() === 6); // 6 - суббота
        const year = now.getFullYear();
        document.getElementById('live-time').innerText = (year % 2 === 0) ? "Суббота 10:30" : "Суббота 14:30";

        // 2. Загрузка данных Rutube из исходного вебхука
        async function loadContent() {
            const player = document.getElementById('rutubePlayer');
            const statusEl = document.getElementById('rutube-status');
            
            const apiUrl = 'https://script.google.com/macros/s/AKfycbxF635vQvSP0QTBJ4QdpfnbndTehP2RM1h9UDNAFvtneKexRUOyuLSImdvwivXIrQUR/exec';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (isSaturday) {
                    // СУББОТА: показываем трансляцию/концерт
                    if (data.liveId) {
                        player.src = `https://rutube.ru/play/embed/${data.liveId}/?skinColor=d57700`;
                        statusEl.innerText = "ПРЯМОЙ ЭФИР / КОНЦЕРТ";
                        statusEl.style.color = "#00ff00";
                    } else {
                        statusEl.innerText = "ЭФИР НЕ НАЙДЕН";
                    }
                } else {
                    // БУДНИ: показываем последнюю проповедь
                    if (data.sermonId) {
                        player.src = `https://rutube.ru/play/embed/${data.sermonId}/?skinColor=d57700`;
                        statusEl.innerText = "ПРОПОВЕДЬ ПРОШЕДШЕЙ СУББОТЫ";
                        statusEl.style.color = "#e2b04a";
                    } else {
                        statusEl.innerText = "ПРОПОВЕДЬ НЕ НАЙДЕНА";
                    }
                }

            } catch (e) {
                console.error("Ошибка загрузки данных вебхука Rutube:", e);
                statusEl.innerText = "ОШИБКА ПОДКЛЮЧЕНИЯ";
            }
        }

        // 3. Отдельная загрузка свежего видео YouTube
        async function loadYouTubeStream() {
            const youtubePlayer = document.getElementById('youtubePlayer');
            // Актуальный рабочий URL вашего Google Apps Script для YouTube
            const youtubeApiUrl = 'https://script.google.com/macros/s/AKfycbz0szceKCuFvHAsYOUM2-U-7tSj9MVJRghRAlfwL1-kHmRNz8x9kFtlTvUMH-D0FJAC/exec';

            try {
                const response = await fetch(youtubeApiUrl);
                const data = await response.json();

                // Проверяем наличиe youtubeId и что он не содержит ошибок/текста
                if (data.status === 'success' && data.youtubeId && !data.youtubeId.includes('НЕ НАЙДЕН') && !data.youtubeId.includes('Укажите')) {
                    youtubePlayer.src = `https://www.youtube.com/embed/${data.youtubeId}?autoplay=1&rel=0`;
                } else {
                    console.warn("YouTube: Прямой эфир или запись не найдены", data);
                }
            } catch (e) {
                console.error("Ошибка загрузки YouTube:", e);
            }
        }

        loadContent();
        loadYouTubeStream();
    </script>
</body>
</html>
