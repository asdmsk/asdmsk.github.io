<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение участия</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Логотип */
    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px auto;
      display: block;
      border-radius: 50%;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      color: #ffffff;
    }

    /* Информационная карточка */
    .info-card {
      background-color: #14120e;
      border: 1px solid #d4a359;
      border-radius: 16px;
      padding: 22px 18px;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Увеличенный шрифт для участника и служения */
    .info-line {
      font-size: 19px;
      line-height: 1.4;
      margin: 10px 0;
      color: #ffffff;
    }

    .info-line strong {
      color: #d4a359;
      font-weight: 600;
    }

    .question-text {
      font-size: 16px;
      color: #a0a0a0;
      margin-bottom: 20px;
    }

    /* Кнопки в стиле основных ссылок */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      background-color: #141414;
      border: 1px solid #262626;
      border-radius: 16px;
      color: #ffffff;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: #1f1f1f;
      border-color: #d4a359;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-yes {
      border-color: #2e4d36;
    }
    
    .btn-yes:hover {
      border-color: #4CAF50;
    }

    .btn-no:hover {
      border-color: #e53935;
    }

    .status {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 500;
    }

    .status.success { color: #4CAF50; }
    .status.error { color: #e53935; }
  </style>
</head>
<body>

<div class="container">
  <!-- Логотип сайта -->
  <img src="/logo.png" alt="Логотип" class="logo" onerror="this.style.display='none'">

  <h1 id="title">ПОДТВЕРЖДЕНИЕ УЧАСТИЯ</h1>
  
  <div id="content">
    <div class="info-card">
      <div class="info-line"><strong>Участник:</strong> <span id="fioName">-</span></div>
      <div class="info-line"><strong>Служение:</strong> <span id="serviceName">-</span></div>
    </div>

    <p class="question-text">Сможете ли вы принять участие?</p>
    
    <div class="btn-group">
      <button id="btnYes" class="btn btn-yes" onclick="sendAnswer('yes')">
        ✓ ДА, БУДУ
      </button>
      <button id="btnNo" class="btn btn-no" onclick="sendAnswer('no')">
        ✕ НЕТ, НЕ СМОГУ
      </button>
    </div>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
  const SERVICES = {
    "1": "Открытие",
    "2": "Субботняя школа",
    "3": "Приветы",
    "4": "Приглашение к служению дарами",
    "5": "Молитва за нужды",
    "7": "Детская история"
  };

  const ANSWERS = {
    "yes": "Сообщить о своём участии",
    "no": "Сообщить о своём неучастии по любой причине"
  };

  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfX9O5WWFqlpjw7UtGmts5_KorRs9y3ENBR4xRslUOVhr2FGg/formResponse";

  const hashData = decodeURIComponent(window.location.hash.substring(1));
  const params = hashData.split('-');

  const nameVal = params[0];
  const serviceKey = params[1];

  const contentEl = document.getElementById('content');
  const statusEl = document.getElementById('status');
  const titleEl = document.getElementById('title');

  if (!nameVal || !serviceKey || !SERVICES[serviceKey]) {
    contentEl.style.display = "none";
    titleEl.textContent = "ОШИБКА";
    statusEl.className = "status error";
    statusEl.textContent = "Некорректная ссылка или отсутствуют параметры.";
  } else {
    document.getElementById('fioName').textContent = nameVal;
    document.getElementById('serviceName').textContent = SERVICES[serviceKey];
  }

  function sendAnswer(type) {
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    
    btnYes.disabled = true;
    btnNo.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "Отправка ответа...";

    const serviceText = SERVICES[serviceKey];
    const answerText = ANSWERS[type];

    const formData = new FormData();
    // Исправленные ID полей из вашей ссылки:
    formData.append("entry.1967454923", serviceText); 
    formData.append("entry.130958526", answerText);
    formData.append("entry.1852639773", nameVal);

    fetch(FORM_URL, {
      method: "POST",
      mode: "no-cors",
      body: formData
    })
    .then(() => {
      contentEl.style.display = "none";
      titleEl.textContent = "СПАСИБО!";
      statusEl.className = "status success";
      statusEl.textContent = "✓ Ваш ответ успешно записан.";
    })
    .catch(err => {
      btnYes.disabled = false;
      btnNo.disabled = false;
      statusEl.className = "status error";
      statusEl.textContent = "Ошибка отправки. Попробуйте еще раз.";
    });
  }
</script>

</body>
</html>
